# Full stack: API on 8000, UI on 5173.
#
#   docker compose up --build
#
# The API builds its SQLite store from the committed backend/data/clean/ CSVs
# on first start (about a second). No network is needed for historical data;
# the live feeds (USGS, GDACS, NASA EONET) are fetched at runtime.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      HAZARDS_ENABLED: "${HAZARDS_ENABLED:-true}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
